<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Windows 11 (Web) - Welcome</title>
    <link rel="icon" href="./all/ru/static/favicon.png" />
    <link rel="stylesheet" href="./style.css"/>
</head>

<body>
    
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-container">

            <!-- STEP 1 -->
            <div class="welcome-step" id="welcome-step-1">
                <div class="welcome-text">Hello, what should I call you?</div>
                <input type="text" id="welcome-name-input" class="welcome-input" placeholder="Enter your name" />
                <button class="welcome-btn" onclick="welcomeNext()">Next →</button>
            </div>

            <!-- STEP 2 (обычная активация + пароль) -->
            <div class="welcome-step hidden" id="welcome-step-2">
                <div class="welcome-text">Введите ключ активации Windows 11</div>
                <input type="text" id="activation-key-input" class="welcome-input" placeholder="Ключ активации" />
                <input type="password" id="password-input" class="welcome-input" placeholder="Пароль (для аккаунта)" />
                <button class="welcome-btn" onclick="activationSubmit(2)">Активировать</button>
            </div>

            <!-- STEP 99 (если имя содержит admin) -->
            <div class="welcome-step hidden" id="welcome-step-99">
                <div class="welcome-text">введите пароль</div>
                <input type="text" id="admin-key-input" class="welcome-input" placeholder="Ключ админа" />
                <input type="password" id="admin-password-input" class="welcome-input" placeholder="Пароль админа" />
                <button class="welcome-btn" onclick="activationSubmit(99)">Подтвердить</button>
            </div>

            <!-- STEP 3 -->
            <div class="welcome-step hidden" id="welcome-step-3">
                <div class="welcome-text-large" id="welcome-greeting">Welcome!</div>
                <button class="welcome-btn" onclick="welcomeFinish()">Get Started</button>
            </div>

        </div>
    </div>

    <script src="./welcome.js"></script>
</body>
</html>
